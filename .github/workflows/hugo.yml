# Every push builds the site to check that it still works; nothing is published.
# Publishing to GitHub Pages happens only when the workflow is started by hand
# (Actions -> "Build / deploy" -> Run workflow) and Pages is enabled with
# Settings -> Pages -> Source: "GitHub Actions".
name: Build / deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.168.0
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Install Hugo
        run: |
          curl -fsSLo "${RUNNER_TEMP}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}/hugo"
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Pages
        if: env.PUBLISH == 'true'
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify ${BASE_URL:+--baseURL "${BASE_URL}/"}

      - name: Upload artifact
        if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
